name: jewellery_ops_mobile
description: "Role-aware mobile operations app for jewellery orders and workshop flow."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  path_provider: ^2.1.2
  sqflite: ^2.3.2
  google_fonts: ^6.2.1
  fluttertoast: ^8.2.14
  easy_mask: ^2.0.1
  shared_preferences: ^2.3.2
  get: ^4.6.6
  file_picker: ^8.1.7
  connectivity_plus: ^7.3.1
  flutter_bloc: ^8.1.6
  flutter_secure_storage: ^9.2.2
  dio: ^5.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#0D6252"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/

